name: release
permissions:
  contents: write

on:
  push:
    tags:
    - "v[0-9]+.*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7.3.0
      with:
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
