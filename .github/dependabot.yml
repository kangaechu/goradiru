version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: daily
      time: "19:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    schedule:
      interval: daily
      time: "19:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
